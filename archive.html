  <meta charset="UTF-8" />

  <title>WTLEB 1720 AM - Archived Transmissions</title>

  <link rel="icon" type="image/png" sizes="32x32" href="/images/favicon/favicon-32x32.png">

  <style>
    .status { text-align: center; color: #c9472d; margin-bottom: 30px; font-size: 14px; letter-spacing: 1px; font-weight: bold; }
    .text { text-align: center; font-size: 13px; color: #888; margin-bottom: 40px; line-height: 1.6; }
    .archive-container { border-top: 1px solid #222; padding-top: 10px; }
    .archive-entry { padding: 20px 0; border-bottom: 1px solid #1a1a1a; }
    .transmission-id { color: #666; font-size: 11px; letter-spacing: 1px; margin-bottom: 6px; }
    .transmission-status { color: #666; font-size: 11px; margin-bottom: 10px; letter-spacing: 1px; }
    .transmission-link,
    .transmission-link:link,
    .transmission-link:visited { color: #e0a106; -webkit-text-fill-color: #e0a106; text-decoration: none; font-size: 18px; letter-spacing: 1px; line-height: 1.4; }
    .transmission-link:hover,
    .transmission-link:focus { color: #ffffff; -webkit-text-fill-color: #ffffff; }
    .transmission-date { color: #666; font-size: 11px; margin-top: 10px; letter-spacing: 1px; }
    .inline-link,
    .inline-link:link,
    .inline-link:visited { color: #e0a106; -webkit-text-fill-color: #e0a106; text-decoration: underline; font-size: 10px; }
    .inline-link:hover,
    .inline-link:focus { color: #ffffff; -webkit-text-fill-color: #ffffff; }
    @media (max-width: 768px) { .transmission-link { font-size: 16px; } }

<body>
  <div class="container">
    <div class="layout">
      <div class="main">
        <h1 class="page-title">ARCHIVED TRANSMISSIONS</h1>

        <div class="text">
          Historical transmissions have been indexed for continuity review.<br>
          Some records may be incomplete, corrupted, or internally inconsistent.<br>
          Signal degradation increases with archive depth.
        </div>

        <div id="archive-list" class="archive-container">
          <!-- archive.js populates this -->
        </div>
      </div>

      <div id="station-navigation" class="sidebar"></div>
    </div>
  </div>

  <script src="/js/footer.js"></script>
